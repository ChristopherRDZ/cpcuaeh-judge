[uwsgi]
chdir = /srv/dmoj/site
pythonpath = /srv/dmoj/site
virtualenv = /srv/dmoj/venv

module = dmoj.wsgi:application
env = DJANGO_SETTINGS_MODULE=dmoj.settings
master = true
protocol = uwsgi

# Copy to /srv/dmoj/site/uwsgi.ini. dmoj-web.service runs it as dmoj-uwsgi and
# creates /run/dmoj-web; Nginx reaches the socket through the dmoj-uwsgi group.
uwsgi-socket = /run/dmoj-web/site.sock
chmod-socket = 660
pidfile = /run/dmoj-web/site.pid

workers = 4
threads = 2
listen = 128
buffer-size = 65535

# Bound hung application requests. Validate against legitimate long requests.
# A timeout terminates the entire worker, including its other active threads.
harakiri = 120
harakiri-verbose = true
